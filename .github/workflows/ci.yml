name: CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (all workspaces)
        run: npm run typecheck

      - name: Lint (all workspaces)
        run: npm run lint

      - name: Unit tests — Cloud Run
        run: npm test --workspace=cloud-run

      - name: Unit tests — Firestore rules
        run: npm run test:rules --workspace=cloud-run

      - name: Unit tests — App
        run: npm test --workspace=app

      - name: Unit tests — Graphics
        run: npm test --workspace=graphics
